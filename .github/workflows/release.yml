name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Run tests
      run: |
        # Run only unit tests (no integration tests that require Spanner emulator)
        go test ./cmd/spannerdef -v
        go test . -v -run "TestParseDDLs|TestGenerateDDLs"

    - name: Set up environment variables
      run: |
        echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

    - name: Build binaries
      run: |
        mkdir -p dist
        
        # macOS ARM64
        CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
          -ldflags="-s -w -X main.version=${{ env.VERSION }} -X main.buildDate=${{ env.BUILD_DATE }}" \
          -o dist/spannerdef-${{ env.VERSION }}-darwin-arm64 \
          ./cmd/spannerdef
        
        # macOS AMD64
        CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build \
          -ldflags="-s -w -X main.version=${{ env.VERSION }} -X main.buildDate=${{ env.BUILD_DATE }}" \
          -o dist/spannerdef-${{ env.VERSION }}-darwin-amd64 \
          ./cmd/spannerdef
        
        # Linux ARM64
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
          -ldflags="-s -w -X main.version=${{ env.VERSION }} -X main.buildDate=${{ env.BUILD_DATE }}" \
          -o dist/spannerdef-${{ env.VERSION }}-linux-arm64 \
          ./cmd/spannerdef
        
        # Linux AMD64
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -ldflags="-s -w -X main.version=${{ env.VERSION }} -X main.buildDate=${{ env.BUILD_DATE }}" \
          -o dist/spannerdef-${{ env.VERSION }}-linux-amd64 \
          ./cmd/spannerdef

    - name: Generate checksums
      run: |
        cd dist
        sha256sum * > checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        prerelease: false
        generate_release_notes: true
        files: |
          dist/*
        body: |
          ## What's New
          
          Release ${{ env.VERSION }} of spannerdef
          
          ### Download
          
          Choose the binary for your platform:
          
          **macOS** (13 Ventura or later):
          - [spannerdef-${{ env.VERSION }}-darwin-arm64](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/spannerdef-${{ env.VERSION }}-darwin-arm64) (Apple Silicon)
          - [spannerdef-${{ env.VERSION }}-darwin-amd64](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/spannerdef-${{ env.VERSION }}-darwin-amd64) (Intel)
          
          **Linux:**
          - [spannerdef-${{ env.VERSION }}-linux-arm64](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/spannerdef-${{ env.VERSION }}-linux-arm64) (ARM64)
          - [spannerdef-${{ env.VERSION }}-linux-amd64](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/spannerdef-${{ env.VERSION }}-linux-amd64) (AMD64)
          
          ### Verification
          
          You can verify the integrity of downloaded files using the checksums:
          ```bash
          sha256sum -c checksums.txt
          ```
          
          ### Installation
          
          1. Download the appropriate binary for your platform
          2. Make it executable: `chmod +x spannerdef-*`
          3. Move to your PATH: `sudo mv spannerdef-* /usr/local/bin/spannerdef`
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up ko
      # Logs in to ghcr.io with GITHUB_TOKEN automatically.
      uses: ko-build/setup-ko@d006021bd0c28d1ce33a07e7943d48b079944c8d # v0.9
      with:
        version: v0.19.1

    - name: Build and push container image
      # ko compiles ./cmd/spannerdef (settings in .ko.yaml) into a multi-arch
      # image on a static distroless base and pushes
      # ghcr.io/<owner>/spannerdef:<tag> and :latest with an SPDX SBOM.
      # No Dockerfile or Docker daemon is involved.
      run: |
        # Image references must be lowercase; the repository slug may not be.
        repository="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
        export KO_DOCKER_REPO="ghcr.io/${repository}"
        ko build ./cmd/spannerdef \
          --bare \
          --platform=linux/amd64,linux/arm64 \
          --tags="${VERSION},latest" \
          --sbom=spdx \
          --image-label="org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
          --image-label="org.opencontainers.image.version=${VERSION}" \
          --image-label="org.opencontainers.image.revision=${GITHUB_SHA}"

    - name: Publish the release
      # The release is created as a draft above and only published once the
      # image is pushed, so a failed image build never leaves a public release
      # without its container. Re-running the workflow on the same tag
      # re-pushes the image and publishes the existing draft.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release edit "$VERSION" --draft=false
