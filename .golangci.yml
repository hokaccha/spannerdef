version: "2"

linters:
  settings:
    staticcheck:
      # golangci-lint's default set, minus QF1003 (tagged-switch rewrites are a
      # style preference, not a defect).
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1003
  exclusions:
    rules:
      # Tests close clients in defer statements; the returned error is not useful there.
      - path: _test\.go
        linters:
          - errcheck
