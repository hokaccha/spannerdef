name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Start Spanner Omni
      # Omni's single-server mode uses project=default, instance=default
      # and listens on gRPC 15000. --network host isn't reliable on GitHub
      # Actions Linux runners, so publish the port explicitly.
      run: |
        docker run -d \
          --name spanneromni \
          -p 15000:15000 \
          -v spanner:/spanner \
          us-docker.pkg.dev/spanner-omni/images/spanner-omni:2026.r1-beta \
          start-single-server

    - name: Wait for Spanner Omni to be ready
      run: |
        for i in $(seq 1 90); do
          if docker logs spanneromni 2>&1 | grep -q "Spanner is ready"; then
            echo "Spanner Omni is ready"
            exit 0
          fi
          sleep 2
        done
        echo "Spanner Omni failed to become ready"
        docker logs spanneromni
        exit 1

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      env:
        SPANNER_EMULATOR_HOST: localhost:15000
        SPANNER_PROJECT_ID: default
        SPANNER_INSTANCE_ID: default
      run: go test -v -count=1 -timeout 15m -parallel 80 ./...

    - name: Dump Omni logs on failure
      if: failure()
      run: docker logs spanneromni || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
      with:
        # Pinned so the lint gate only changes when this line does.
        version: v2.13.2

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
      with:
        # The action's go-version-input defaults to "stable" and would win over
        # go-version-file; clear it so the scan uses the toolchain releases are built with.
        go-version-input: ''
        go-version-file: go.mod
        go-package: ./...
